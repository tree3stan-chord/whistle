<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whistle - Real-time Pitch to Staff Notation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/coaching.css">
    <link rel="stylesheet" href="css/essential-ai.css">
    <link rel="stylesheet" href="css/staff-controls.css">
</head>
<body>
    <nav style="background: rgba(0,0,0,0.95); border-bottom: 1px solid #404040; height: 60px; position: sticky; top: 0; z-index: 1000;">
        <div style="display: grid; grid-template-columns: auto 1fr; align-items: center; height: 60px; max-width: 1400px; margin: 0 auto; padding: 0 24px;">
            <h1 style="font-size: 20px; font-weight: 600; color: #667eea; margin: 0;">🎵 whistle</h1>
            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 24px;">
                <button id="saveSessionBtn" style="display: inline-block;" title="Save Session">💾 Save</button>
                <button id="loadSessionBtn" style="display: inline-block;" title="Load Session">📂 Load</button>
                <div id="connectivityStatus" style="display: inline-block;">●</div>
                <span id="authInfo" style="display: inline-block; font-size: 14px; color: #999;">Guest session</span>
                <button id="authBtn" style="display: inline-block;" title="Login / Register">👤</button>
                <button id="debugToggle" style="display: inline-block;" title="Toggle Debug View">🔧</button>
                <button id="fullscreenBtn" style="display: inline-block;" title="Fullscreen">⛶</button>
            </div>
        </div>
    </nav>

    <main class="app-main">
        <!-- Primary controls section -->
        <div class="primary-controls">
            <div class="transport-controls">
                <button id="startBtn" type="button" class="primary-btn record-btn">
                    <span class="btn-icon">🎤</span>
                    <span class="btn-text">Start Recording</span>
                </button>
                <button id="stopBtn" type="button" class="primary-btn stop-btn" disabled>
                    <span class="btn-icon">⏹</span>
                    <span class="btn-text">Stop</span>
                </button>
            </div>
            
        </div>

        <!-- Advanced Export Modal (accessible via Export All) -->
        <div id="exportModal" class="export-modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Export Options</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="export-grid">
                    <button id="exportJsonBtn" type="button" class="export-option">
                        <span class="btn-icon">📄</span>
                        <span class="btn-text">JSON</span>
                    </button>
                    <button id="exportMusicXmlBtn" type="button" class="export-option">
                        <span class="btn-icon">🎼</span>
                        <span class="btn-text">MusicXML</span>
                    </button>
                    <button id="exportSvgBtn" type="button" class="export-option">
                        <span class="btn-icon">📊</span>
                        <span class="btn-text">SVG</span>
                    </button>
                    <button id="exportPdfBtn" type="button" class="export-option">
                        <span class="btn-icon">📋</span>
                        <span class="btn-text">PDF</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Status and pitch display -->
        <div class="status-section">
            <div class="status-main">
                <span id="statusText" class="status-text">Click "Start Recording" to begin</span>
            </div>
            <div class="pitch-info">
                <span id="pitchDisplay" class="pitch-display">--</span>
                <span class="pitch-label">Current Note</span>
            </div>
        </div>

        <!-- Staff Controls (directly above staff) -->
        <div class="staff-controls">
            <div class="staff-controls-left">
                <div class="input-mode-selector">
                    <label class="control-label">Mode:</label>
                    <div class="mode-buttons">
                        <button id="vocalModeBtn" type="button" class="mode-btn active">
                            <span class="mode-icon">🎤</span>
                            <span>Vocal</span>
                        </button>
                        <button id="instrumentModeBtn" type="button" class="mode-btn">
                            <span class="mode-icon">🎼</span>
                            <span>Instrument</span>
                        </button>
                    </div>
                </div>
                
                <div class="staff-actions">
                    <button id="clearBtn" type="button" class="staff-btn clear-btn">
                        <span class="btn-icon">🗑</span>
                        <span class="btn-text">Clear Staff</span>
                    </button>
                    <button id="analyzeRhythmBtn" type="button" class="staff-btn">
                        <span class="btn-icon">🎵</span>
                        <span class="btn-text">Analyze Rhythm</span>
                    </button>
                </div>
            </div>
            
            <div class="staff-controls-right">
                <div class="quantization-control">
                    <button id="quantizeToggleBtn" type="button" class="staff-btn quantize-btn" disabled>
                        <span class="btn-icon">📏</span>
                        <span class="btn-text">Enable Quantization</span>
                    </button>
                </div>
                
                <div class="export-quick">
                    <button id="exportPngBtn" type="button" class="staff-btn export-btn">
                        <span class="btn-icon">🖼</span>
                    </button>
                    <button id="exportMidiBtn" type="button" class="staff-btn export-btn">
                        <span class="btn-icon">🎹</span>
                    </button>
                    <button id="exportAllBtn" type="button" class="staff-btn export-all-btn">
                        <span class="btn-icon">📦</span>
                        <span class="btn-text">Export All</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Staff notation canvas -->
        <div class="notation-section">
            <div class="staff-container">
                <canvas id="staffCanvas" width="1200" height="400"></canvas>
            </div>
        </div>

        <!-- Debug panel (initially hidden) -->
        <div id="debugPanel" class="debug-panel hidden">
            <div class="debug-header">
                <h3>Debug Information</h3>
            </div>
            <div class="debug-content">
                <div class="debug-group">
                    <h4>Audio Analysis</h4>
                    <div class="debug-row">
                        <span class="debug-label">Frequency:</span>
                        <span id="freqDisplay" class="debug-value">--</span>
                    </div>
                    <div class="debug-row">
                        <span class="debug-label">Note:</span>
                        <span id="noteDisplay" class="debug-value">--</span>
                    </div>
                    <div class="debug-row">
                        <span class="debug-label">Onset:</span>
                        <span id="onsetDisplay" class="debug-value">--</span>
                    </div>
                    <div class="debug-row">
                        <span class="debug-label">Flux:</span>
                        <span id="fluxDisplay" class="debug-value">--</span>
                    </div>
                </div>
                
                <div class="debug-group">
                    <h4>Rhythm Analysis</h4>
                    <div class="debug-row">
                        <span class="debug-label">Tempo:</span>
                        <span id="tempoDisplay" class="debug-value">--</span>
                    </div>
                    <div class="debug-row">
                        <span class="debug-label">Beat Phase:</span>
                        <span id="beatPhaseDisplay" class="debug-value">--</span>
                    </div>
                    <div class="debug-row">
                        <span class="debug-label">Intervals:</span>
                        <span id="intervalsDisplay" class="debug-value">--</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Authentication Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="authModalTitle">Login / Register</h3>
                <span class="modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="auth-tabs">
                    <button id="loginTab" class="tab-btn active">Login</button>
                    <button id="registerTab" class="tab-btn">Register</button>
                </div>
                
                <form id="authForm" class="auth-form">
                    <div class="form-group">
                        <label for="authEmail">Email:</label>
                        <input type="email" id="authEmail" required>
                    </div>
                    
                    <div id="usernameGroup" class="form-group" style="display: none;">
                        <label for="authUsername">Username (optional):</label>
                        <input type="text" id="authUsername">
                    </div>
                    
                    <div class="form-group">
                        <label for="authPassword">Password:</label>
                        <input type="password" id="authPassword" required>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" id="authSubmitBtn" class="primary-btn">Login</button>
                        <button type="button" id="authCancelBtn" class="secondary-btn">Cancel</button>
                        <button type="button" id="logoutBtn" class="secondary-btn" style="display: none;">Logout</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Session Management Modal -->
    <div id="sessionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="sessionModalTitle">Session Management</h3>
                <span class="modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="session-tabs">
                    <button id="saveTab" class="tab-btn active">Save Session</button>
                    <button id="loadTab" class="tab-btn">Load Session</button>
                </div>
                
                <!-- Save Session Tab -->
                <div id="saveSessionTab" class="tab-content">
                    <form id="saveSessionForm" class="session-form">
                        <div class="form-group">
                            <label for="sessionName">Session Name:</label>
                            <input type="text" id="sessionName" placeholder="My Melody Session">
                        </div>
                        
                        <div class="form-group">
                            <label for="sessionDescription">Description (optional):</label>
                            <textarea id="sessionDescription" placeholder="Description of this session..."></textarea>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="primary-btn">Save Session</button>
                            <button type="button" class="secondary-btn modal-close">Cancel</button>
                        </div>
                    </form>
                </div>
                
                <!-- Load Session Tab -->
                <div id="loadSessionTab" class="tab-content" style="display: none;">
                    <div class="session-list">
                        <div id="sessionListContainer">
                            <div class="loading">Loading sessions...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notifications" class="notifications"></div>

    <script src="js/audio.js"></script>
    <script src="js/audio-config.js"></script>
    <script src="js/yin.js"></script>
    <script src="js/onset.js"></script>
    <script src="js/tempo.js"></script>
    <script src="js/harmonic-filter.js"></script>
    <script src="js/signal-conditioner.js"></script>
    <script src="js/rhythm-quantizer.js"></script>
    <script src="js/articulation.js"></script>
    <script src="js/enharmonic-detector.js"></script>
    <script src="js/key-detector.js"></script>
    <script src="js/pitch.js"></script>
    <script src="js/notation.js"></script>
    <script src="js/vocal-notation-renderer.js"></script>
    <script src="js/enhanced-export.js"></script>
    <script src="js/staff-config.js"></script>
    <script src="js/playhead.js"></script>
    <script src="js/register-detector.js"></script>
    <script src="js/session-manager.js"></script>
    
    <!-- Forensic Analysis System -->
    <script src="js/spectral-analyzer.js"></script>
    <script src="js/dynamics-analyzer.js"></script>
    <script src="js/articulation-classifier.js"></script>
    <script src="js/midi-mapper.js"></script>
    <script src="js/forensic-analyzer.js"></script>
    <script src="js/forensic-integration.js"></script>
    
    <!-- Vocal Transcription System -->
    <script src="js/vocal-stt-engine.js"></script>
    <script src="js/syllable-note-aligner.js"></script>
    <script src="js/offline-phoneme-detector.js"></script>
    <script src="js/vocal-transcription-engine.js"></script>
    
    <!-- Advanced Articulation Analysis -->
    <script src="js/advanced-vibrato-analyzer.js"></script>
    <script src="js/articulation-connection-detector.js"></script>
    <script src="js/breathing-pattern-analyzer.js"></script>
    <script src="js/dynamic-accent-detector.js"></script>
    <script src="js/crescendo-diminuendo-analyzer.js"></script>
    <script src="js/rubato-tempo-detector.js"></script>
    <script src="js/vocal-expression-classifier.js"></script>
    <script src="js/articulation-transcription-integration.js"></script>
    
    <!-- Real-Time Vocal Coaching System -->
    <script src="js/real-time-vocal-coach.js"></script>
    
    <!-- Phase 6: Professional Export System -->
    <script src="js/enhanced-professional-exporter.js"></script>
    
    <!-- Phase 7: Multi-Language Vocal Transcription -->
    <script src="js/multi-language-vocal-transcription.js"></script>
    
    <!-- Phase 8: Harmonic Context Analysis -->
    <script src="js/harmonic-context-analyzer.js"></script>
    
    <!-- Phase 7+8: Advanced Musical Intelligence -->
    <script src="js/advanced-musical-intelligence.js"></script>
    
    <!-- Essential AI Utilities -->
    <script src="js/essential-ai-utilities.js"></script>
    
    <script src="js/app.js"></script>
</body>
</html>
