<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whistle - Real-time Pitch to Staff Notation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🎵 Whistle</h1>
        <p>Real-time pitch-to-staff notation</p>
    </header>

    <main>
        <div class="controls">
            <button id="startBtn" type="button">Start Listening</button>
            <button id="stopBtn" type="button" disabled>Stop</button>
            <button id="clearBtn" type="button">Clear</button>
            <button id="analyzeRhythmBtn" type="button">Analyze Rhythm</button>
            <button id="quantizeToggleBtn" type="button" disabled>Enable Quantization</button>
            <button id="exportPngBtn" type="button">Export PNG</button>
            <button id="exportJsonBtn" type="button">Export JSON</button>
        </div>
        
        <div class="controls">
            <label>Input Mode:</label>
            <button id="vocalModeBtn" type="button" class="mode-btn active">Vocal</button>
            <button id="instrumentModeBtn" type="button" class="mode-btn">Whistle/Instrument</button>
        </div>

        <div class="status">
            <span id="statusText">Click "Start Listening" to begin</span>
            <span id="pitchDisplay">--</span>
        </div>

        <div class="staff-container">
            <canvas id="staffCanvas" width="1200" height="400"></canvas>
        </div>

        <div class="debug">
            <span>Frequency: <span id="freqDisplay">--</span> Hz</span>
            <span>Note: <span id="noteDisplay">--</span></span>
            <span>Onset: <span id="onsetDisplay">--</span></span>
            <span>Flux: <span id="fluxDisplay">--</span></span>
        </div>
        
        <div class="debug">
            <span>Tempo: <span id="tempoDisplay">--</span> BPM</span>
            <span>Beat Phase: <span id="beatPhaseDisplay">--</span></span>
            <span>Intervals: <span id="intervalsDisplay">--</span></span>
        </div>
    </main>

    <script src="js/audio.js"></script>
    <script src="js/yin.js"></script>
    <script src="js/onset.js"></script>
    <script src="js/tempo.js"></script>
    <script src="js/harmonic-filter.js"></script>
    <script src="js/signal-conditioner.js"></script>
    <script src="js/rhythm-quantizer.js"></script>
    <script src="js/articulation.js"></script>
    <script src="js/pitch.js"></script>
    <script src="js/notation.js"></script>
    <script src="js/staff-config.js"></script>
    <script src="js/playhead.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
