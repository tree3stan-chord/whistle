upstream whistle_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    server_name  whistle.musicsian.com;
    root         /var/www/whistle.musicsian.com/current/public;
    index        index.html;

    access_log  /var/log/nginx/whistle.access.log;
    error_log   /var/log/nginx/whistle.error.log;

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://whistle_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Don't cache API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Proxy shared session URLs to backend
    location /shared/ {
        proxy_pass http://whistle_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Don't cache shared sessions
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Proxy health checks to backend
    location /health {
        proxy_pass http://whistle_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        access_log off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # cache long‑lived static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Enable gzip for text-based assets
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript text/javascript;
    }

    # Handle SPA routing - serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
        
        # Short cache for HTML
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # Security: deny access to sensitive files
    location ~* \.(env|log|sql|db)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/whistle.musicsian.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/whistle.musicsian.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}server {
    if ($host = whistle.musicsian.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name  whistle.musicsian.com;

    listen 80;
    return 404; # managed by Certbot


}